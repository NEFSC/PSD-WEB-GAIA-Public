name: gaia
channels:
  - conda-forge
channel_priority: strict

dependencies:
  # Core
  - python=3.12
  - pip

  # Web / app
  - django
  - gunicorn
  - whitenoise
  - celery
  - flower                 # ok to keep; remove if not used
  - psycopg2
  - django-picklefield
  - django-debug-toolbar   # guard with if DEBUG in settings.py
  # Monitoring / metrics
  - prometheus_client  # Metrics (conda-forge pkg name; was prometheus-client)
  - curl
  # Worker/runtime utilities
  - psutil
  - git

  # Geo core (Py3.12-compatible)
  - gdal=3.9.*             # single GDAL line; do NOT also pin libgdal*
  - rasterio=1.3.10
  - fiona=1.9.6
  - pyogrio=0.9.*
  - pyproj=3.6.*
  - shapely=2.0.*
  - geopandas=0.14.4
  - rio-cogeo

  # Numerics / data
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - python-dateutil    # For robust date parsing

  # Cloud / IO / auth
  - requests
  - httpx                  # keep if you import it
  - boto3
  - azure-core
  - azure-identity
  - azure-storage-blob
  - redis-py>=4.5,<6

  # Config / settings
  - pydantic
  - pydantic-settings
  - python-dotenv

  # Utilities
  - setuptools
  - wheel

  - pip:
      - django-admin-sortable2
      - django-extensions  # Additional development tools for Django
      - django-two-factor-auth[phonenumbers]
      - django-otp
      - django-otp-yubikey  # YubiKey support for django-otp
      - webauthn  # FIDO2/WebAuthn support for passkeys
      - qrcode[pil]